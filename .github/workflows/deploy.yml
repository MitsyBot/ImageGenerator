name: GHCR-MITSY-IMAGESERVER

on:
  push:
    branches:
      - development

jobs:
  push_to_registry:
    name: Push para ghcr
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Docker builder
        uses: docker/setup-buildx-action@v1

      - name: Login GHCR
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.TOKEN }}

      - name: Fazer o build e o push
        uses: docker/build-push-action@v2
        with:
          context: .
          version: latest
          file: Dockerfile
          push: true
          tags: ghcr.io/mitsybot/image-generator:latest
      - name: Enviar os arquivos para maquina da mitsy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            docker stop Generator
            docker rm Generator
            docker image rm ghcr.io/mitsybot/image-generator:latest
            docker pull ghcr.io/mitsybot/image-generator:latest
            docker run -it -d --pid=host -p 2080:2080 --name Generator ghcr.io/mitsybot/image-generator:latest 